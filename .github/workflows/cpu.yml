name: CPU and public evidence
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python release/rebuild_upstream.py
      - run: python release/check_cpu.py
      - run: python examples/cpu_attention.py
      - run: python release/verify_public_results.py
      - run: python release/verify_manifest.py
